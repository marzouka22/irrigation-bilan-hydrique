spring.application.name=collecte-service
server.port=8081

# Base de données propre au microservice Collecte (aucune base partagée)
spring.datasource.url=jdbc:mysql://localhost:3306/collecte_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
